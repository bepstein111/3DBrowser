services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/bepstein111/3dbrowser:latest
    environment:
      # Directory inside the container to expose to the browser.
      ROOT: ${MODELS_ROOT:-/models}
      PORT: "8080"
    volumes:
      # Mount a host folder into the container. Override MODELS_DIR, e.g.
      #   MODELS_DIR=C:/models docker compose up --build
      - type: bind
        source: ${MODELS_DIR:-./sample}
        target: /models
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped
