services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      # Directory inside the container to expose to the browser.
      ROOT: ${MODELS_ROOT:-/models}
      PORT: "8787"
    volumes:
      # Mount a host folder into the container. Override MODELS_DIR, e.g.
      #   MODELS_DIR=C:/models docker compose up --build
      - type: bind
        source: ${MODELS_DIR:-./sample}
        target: /models
    expose:
      - "8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
