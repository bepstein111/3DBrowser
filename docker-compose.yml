services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/bepstein111/3dbrowser:latest
    environment:
      APP_PORT: "8080"
    #or use the .env.example file to set environment variables (rename it to .env)
    #env_file:
    #  - .env
    volumes:
      # Mount a host folder into the container. Override MODELS_DIR, e.g.
      #   MODELS_DIR=C:/models docker compose up --build
      - type: bind
        source: ${MODELS_DIR:-./sample}
        target: /models
    ports:
      - "${HTTP_PORT:-8181}:8080"
    restart: unless-stopped
